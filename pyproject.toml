[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abus-dual-expert-experiments"
version = "0.1.0"
description = "Heterogeneous R3D and tri-planar ConvNeXt-MIL classification for ABUS"
readme = "README.md"
requires-python = ">=3.8,<3.11"
license = {text = "MIT"}
authors = [
    {name = "Research Team"}
]
keywords = [
    "medical-imaging",
    "deep-learning",
    "dual-expert-fusion",
    "3d-classification",
    "computer-vision"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/zongjunlv/abus-dual-expert-experiments"

dependencies = [
    "torch==1.13.0",
    "torchvision==0.14.0",
    "numpy>=1.21.0,<2.0",
    "pandas>=1.3.0,<3.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.5.0",
    "tensorboard>=2.10.0",
    "tensorboardX>=2.4",
    "swanlab[dashboard]>=0.6.0",
    "monai==1.3.0",
    "nibabel>=5.1.0",
    "SimpleITK>=2.1.0",
    "medpy>=0.4.0",
    "scikit-image>=0.19.0",
    "h5py>=3.0.0",
    "packaging>=21.0",
    "timm==1.0.26",
    "chardet>=4.0.0",
    "yacs>=0.1.8",
    "termcolor>=1.1.0",
    "submitit>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.setuptools.packages.find]
exclude = [
    "outputs*",
    "dataset*",
    "scripts*",
    "tests*",
    "paper*",
    "plan*",
    "temp*",
]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | outputs
  | dataset
)/
'''

[tool.ruff]
line-length = 88
target-version = "py38"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "N806",  # variable in function should be lowercase (conflicts with scientific naming)
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports (for exports)

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=models",
    "--cov=trainer",
    "--cov=utils",
    "--cov=data",
    "--cov-report=term-missing",
    "--cov-report=html",
]
